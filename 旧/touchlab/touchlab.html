<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タッチで曲がりを読む実験</title>
<style>
  :root { --bg:#101216; --panel:#181b21; --panel2:#20242c; --line:#2f343e; --fg:#eef0f3; --mut:#9aa1ab; --accent:#5aa9ff; --ok:#3ecf8e; --warn:#f5b84b; --ng:#ff6b6b; }
  * { box-sizing:border-box; } [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 system-ui,"Hiragino Sans","Yu Gothic UI",sans-serif; }
  main { max-width:1060px; margin:0 auto; padding:16px; display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:14px; }
  @media (max-width:820px) { main { grid-template-columns:minmax(0,1fr); } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:14px; }
  h1 { font-size:19px; margin:0 0 6px; } h2 { font-size:15px; margin:0 0 6px; color:var(--mut); }
  #now { font-size:30px; font-weight:800; line-height:1.35; min-height:126px; }
  .bar { height:10px; background:var(--panel2); border-radius:5px; overflow:hidden; } .bar i { display:block; height:100%; width:0; background:var(--accent); }
  .btn { font:inherit; font-weight:700; color:inherit; border:1px solid var(--line); background:var(--panel2); padding:9px 18px; border-radius:10px; cursor:pointer; margin-top:10px; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#04203f; } .btn:disabled { opacity:.35; cursor:default; }
  canvas { width:100%; display:block; background:#0b0d10; border-radius:10px; }
  table { width:100%; border-collapse:collapse; } td { padding:3px 0; border-bottom:1px solid var(--line); } td:last-child { text-align:right; font-variant-numeric:tabular-nums; }
  .mut { color:var(--mut); font-size:13px; } .big { font-size:22px; font-weight:800; } .yes { color:var(--ok); } .some,.mixed { color:var(--warn); } .no,.few { color:var(--ng); }
</style>
</head>
<body>
<main>
  <div>
    <div class="card">
      <h1>タッチだけで、先の関節の曲がりを読めるか</h1>
      <div id="conn" class="mut"></div>
      <div id="now">○に中節の背を置いて［はじめる］</div>
      <div class="bar"><i id="prog"></i></div>
      <button class="btn primary" id="go" disabled>はじめる</button> <button class="btn" id="stop" hidden>やめる</button>
      <div class="mut">約2分。声で案内します。置く・曲げるを4回くり返します。</div>
    </div>
    <div class="card" id="resCard" hidden><h2>結果</h2><div id="res"></div></div>
    <div class="card" id="liveCard" hidden><h2>いまの推定（青）<span id="camNote"></span></h2><div class="big" id="est">—</div><canvas id="graph" width="1000" height="300"></canvas></div>
  </div>
  <div>
    <div class="card"><h2>iPadが感じている接触（マス目は5 mm）</h2><canvas id="blob" width="720" height="520"></canvas><table id="vals"></table></div>
  </div>
</main>
<script type="module" src="./touchlab.js"></script>
</body>
</html>
