<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#101513">
<title>近づけて入れる（iPhone）</title>
<style>
  :root { --bg:#101513; --panel:#1b2420; --fg:#eef4f0; --mut:#9fb0a7; --ok:#4fd58a; }
  * { box-sizing:border-box; } [hidden] { display:none !important; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--fg); font:17px/1.6 system-ui,"Hiragino Sans","Yu Gothic UI",sans-serif; -webkit-user-select:none; user-select:none; transition:background .3s; } body.ok { background:#0f3a22; }
  main { max-width:720px; margin:0 auto; padding:20px max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left)); display:flex; flex-direction:column; gap:16px; }
  h1 { font-size:24px; margin:0; } p { margin:0; } ol { margin:0; padding-left:22px; } .mut { color:var(--mut); font-size:14px; font-variant-numeric:tabular-nums; }
  button { font:inherit; font-weight:600; border:0; border-radius:14px; background:var(--ok); color:#06210f; font-size:20px; min-height:64px; padding:0 22px; width:100%; }
  #state { font-size:26px; font-weight:700; line-height:1.3; } #view { width:100%; height:auto; border-radius:14px; background:#000; display:block; } video { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
</style>
</head>
<body>
<main>
  <section id="start" style="display:flex;flex-direction:column;gap:16px">
    <h1>近づけて入れる（iPhone）</h1>
    <p id="say">背面カメラで、iPadと手を上から見ます。映像はどこにも送りません。</p>
    <ol><li>［はじめる］を押して、カメラを許可する</li><li>スタンドに置く。iPadの画面全体と、その上の手が写る向きに</li><li>文字が「OK」になり、画面が緑になれば準備完了</li></ol>
    <button id="go">はじめる</button>
  </section>
  <section id="live" hidden style="display:flex;flex-direction:column;gap:12px">
    <p id="state"></p>
    <canvas id="view"></canvas>
    <p class="mut" id="sub"></p>
    <p class="mut">緑の枠がiPadの画面、赤い点が画面に付ける関節です。枠がずれたら、iPadの［合わせ直す］を押します。</p>
  </section>
  <video id="v" playsinline muted></video>
</main>
<script type="module" src="./phone.js?v=3"></script>
</body>
</html>
