<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>近づけて入れる（iPhone）</title>
<style>
  :root { --bg:#101513; --panel:#1b2420; --fg:#eef4f0; --mut:#9fb0a7; --ok:#4fd58a; }
  * { box-sizing:border-box; } [hidden] { display:none !important; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--fg); font:17px/1.6 system-ui,"Hiragino Sans","Yu Gothic UI",sans-serif; -webkit-user-select:none; user-select:none; transition:background .3s; } body.ok { background:#0f3a22; }
  main { max-width:720px; margin:0 auto; padding:20px max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left)); display:flex; flex-direction:column; gap:16px; }
  h1 { font-size:24px; margin:0; } p { margin:0; } ol { margin:0; padding-left:22px; } .mut { color:var(--mut); font-size:14px; font-variant-numeric:tabular-nums; }
  button { font:inherit; font-weight:600; border:0; border-radius:14px; background:var(--ok); color:#06210f; font-size:20px; min-height:64px; padding:0 22px; width:100%; }
  video { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
  /* the phone lies on its side: the words are turned when the page itself stands upright (the picture of the camera never needs turning) */
  .land { position:fixed; inset:0; }
  @media (orientation:portrait) { .land { inset:auto; left:50%; top:50%; width:100vh; height:100vw; width:100dvh; height:100dvw; transform:translate(-50%,-50%) rotate(90deg); } }
  #start { overflow:auto; padding:18px max(20px,env(safe-area-inset-right)) 18px max(20px,env(safe-area-inset-left)); display:flex; flex-direction:column; gap:10px; justify-content:center; } #start h1 { font-size:22px; } #start button { min-height:56px; }
  #view { position:fixed; inset:0; width:100%; height:100%; object-fit:contain; background:#000; display:block; }
  #words { pointer-events:none; } #state { position:absolute; left:14px; top:12px; max-width:calc(100% - 28px); font-size:22px; font-weight:700; line-height:1.3; padding:6px 14px; border-radius:12px; background:rgba(0,0,0,.6); } body.ok #state { background:rgba(15,90,45,.85); }
  #sub { position:absolute; left:14px; bottom:12px; padding:4px 10px; border-radius:10px; background:rgba(0,0,0,.6); color:#d5ddd8; }
</style>
</head>
<body>
  <section id="start" class="land">
    <h1>近づけて入れる（iPhone）</h1>
    <p id="say">背面カメラで、iPadと手を上から見ます。映像はどこにも送りません。</p>
    <ol><li>［はじめる］を押して、カメラを許可する</li><li>iPhoneを横向きでスタンドに置く。iPadの画面全体と、その上の手が写るように</li><li>文字が「OK」になり、画面が緑になれば準備完了</li></ol>
    <button id="go">はじめる</button>
  </section>
  <section id="live" hidden>
    <canvas id="view"></canvas>
    <div id="words" class="land"><p id="state"></p><p class="mut" id="sub"></p></div>
  </section>
  <video id="v" playsinline muted></video>
<script type="module" src="./phone.js?v=4"></script>
</body>
</html>
