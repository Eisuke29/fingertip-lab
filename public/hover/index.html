<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#101513">
<title>近づけて入れる（つながるか）</title>
<style>
  :root { --bg:#101513; --panel:#1b2420; --line:#32403a; --fg:#eef4f0; --mut:#9fb0a7; --ok:#4fd58a; --warn:#f0b264; }
  * { box-sizing:border-box; } [hidden] { display:none !important; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--fg); font:17px/1.6 system-ui,"Hiragino Sans","Yu Gothic UI",sans-serif; -webkit-user-select:none; user-select:none; }
  main { max-width:900px; margin:0 auto; padding:24px max(18px,env(safe-area-inset-right)) 40px max(18px,env(safe-area-inset-left)); display:flex; flex-direction:column; gap:20px; }
  h1 { font-size:26px; margin:0; } p { margin:0; } .mut { color:var(--mut); font-size:15px; }
  button { font:inherit; font-weight:600; border:0; border-radius:14px; background:var(--panel); color:var(--fg); min-height:52px; padding:0 22px; } button.go { background:var(--ok); color:#06210f; font-size:20px; min-height:64px; }
  #qr { background:#fff; padding:14px; border-radius:14px; width:min(300px,70vw); } #qr svg { display:block; width:100%; height:auto; }
  .ways { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr)); gap:14px; } .way { background:var(--panel); border-radius:14px; padding:16px 18px; border:2px solid transparent; } .way.on { border-color:var(--ok); } .way b { display:block; } .way .n { font-size:34px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.3; } .way .s { color:var(--mut); font-size:14px; font-variant-numeric:tabular-nums; }
  #pad { position:relative; height:min(46vh,340px); background:var(--panel); border-radius:14px; touch-action:none; overflow:hidden; display:grid; place-items:center; color:var(--mut); text-align:center; } #dot { position:absolute; left:0; top:0; width:44px; height:44px; margin:-22px 0 0 -22px; border-radius:50%; background:var(--ok); display:none; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; } pre { margin:0; white-space:pre-wrap; font:13px/1.6 ui-monospace,monospace; color:var(--mut); background:var(--panel); border-radius:12px; padding:12px; -webkit-user-select:text; user-select:text; }
</style>
</head>
<body>
<main>
  <h1 id="title">つながるか、たしかめる</h1>
  <section id="start"><p id="say">iPadの前面カメラを使います。映像はどこにも送りません。</p><div class="row" style="margin-top:14px"><button class="go" id="go">はじめる</button></div></section>
  <section id="invite" hidden><p>iPhoneの<b>カメラ</b>で読み取る</p><div id="qr" style="margin-top:10px"></div><p class="mut" id="code" style="margin-top:8px"></p></section>
  <section id="live" hidden style="display:flex;flex-direction:column;gap:16px">
    <p id="state" style="font-size:20px;font-weight:700"></p>
    <div class="ways"><div class="way" id="w-direct"><b>直接</b><span class="n">—</span><div class="s"></div></div><div class="way" id="w-relay"><b>中継</b><span class="n">—</span><div class="s"></div></div></div>
    <div id="pad"><span id="padT"></span><div id="dot"></div></div>
    <div class="row" id="where"><span class="mut">いまの場所</span><button data-w="家のWi-Fi">家のWi-Fi</button><button data-w="大学のテザリング">大学のテザリング</button></div>
    <div class="row"><button id="again">つなぎ直す</button><button id="copy">結果をコピー</button></div>
    <pre id="log"></pre>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script type="module" src="./main.js?v=1"></script>
</body>
</html>
