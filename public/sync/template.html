<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>角度の型紙</title>
<style>
  @page { size: A4 portrait; margin: 0; }
  :root { color-scheme: light; }
  html, body { margin: 0; background: #e9e9e9; font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  .tools { padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .tools button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 1px solid #999; background: #fff; cursor: pointer; }
  .sheet { width: 210mm; height: 297mm; margin: 0 auto 24px; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.15); }
  svg { width: 210mm; height: 297mm; display: block; }
  @media print { .tools { display: none; } html, body { background: #fff; } .sheet { box-shadow: none; margin: 0; } }
</style></head>
<body>
<div class="tools">
  <button onclick="print()">印刷する</button>
  <span>A4・<b>倍率100%</b>で印刷し、下の50mmの線が50mmか定規で確かめてください。白い厚紙がおすすめです。</span>
</div>
<div class="sheet"><svg id="s" viewBox="0 0 210 297" xmlns="http://www.w3.org/2000/svg"></svg></div>
<script>
const TPL = [{ id: 'A', thp: 45, thd: 20 }, { id: 'B', thp: 70, thd: 40 }, { id: 'C', thp: 90, thd: 60 }, { id: 'D', thp: 110, thd: 80 }];
const W = 16, Lp = 45, Lm = 25, Ld = 22, r = W / 2;
const s = document.getElementById('s'); let out = '';
const rad = d => d * Math.PI / 180;
out += `<text x="105" y="14" text-anchor="middle" font-size="6" font-weight="700">角度の型紙（同期ラボ・精度の検証用）</text>`;
out += `<text x="105" y="21" text-anchor="middle" font-size="3.4">実線で切り抜き、点線で直角に折ってのりしろを画面に置く。型紙は指と同じ向きで ○ に立てる。</text>`;
TPL.forEach((t, i) => {
  const cx = 30 + (i % 2) * 100, cy = 105 + Math.floor(i / 2) * 120; // PIP centre
  const pip = [cx + 30, cy], dip = [pip[0] + Lm, cy];
  const mcp = [pip[0] - Lp * Math.cos(rad(t.thp)), cy - Lp * Math.sin(rad(t.thp))];
  const tip = [dip[0] + (Ld - r) * Math.cos(rad(t.thd)), cy - (Ld - r) * Math.sin(rad(t.thd))];
  const d = `M${mcp} L${pip} L${dip} L${tip}`;
  out += `<g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="${d}" stroke="#111" stroke-width="${W + 0.6}"/><path d="${d}" stroke="#fff" stroke-width="${W}"/></g>`;
  // fold tab under the middle phalanx
  const y0 = cy + r;
  out += `<rect x="${pip[0] - 2}" y="${y0}" width="${Lm + 4}" height="10" fill="#f3f3f3" stroke="#111" stroke-width="0.3"/>`;
  out += `<line x1="${pip[0] - 2}" y1="${y0}" x2="${dip[0] + 2}" y2="${y0}" stroke="#111" stroke-width="0.3" stroke-dasharray="1.2 1"/>`;
  out += `<text x="${pip[0] + Lm / 2}" y="${y0 + 6.5}" text-anchor="middle" font-size="3">のりしろ</text>`;
  out += `<circle cx="${pip[0]}" cy="${cy}" r="1" fill="#e33"/><circle cx="${dip[0]}" cy="${cy}" r="0.8" fill="#f0953a"/>`;
  out += `<text x="${cx + 20}" y="${cy + 30}" text-anchor="middle" font-size="5" font-weight="700">型紙${t.id}</text>`;
  out += `<text x="${cx + 20}" y="${cy + 36}" text-anchor="middle" font-size="3.6">θp ${t.thp}° ／ θd ${t.thd}°</text>`;
});
out += `<line x1="20" y1="280" x2="70" y2="280" stroke="#111" stroke-width="0.6"/><line x1="20" y1="277" x2="20" y2="283" stroke="#111" stroke-width="0.4"/><line x1="70" y1="277" x2="70" y2="283" stroke="#111" stroke-width="0.4"/>`;
out += `<text x="45" y="276" text-anchor="middle" font-size="3.4">50 mm</text>`;
out += `<text x="190" y="281" text-anchor="end" font-size="3">指の太さ16mm・基節45／中節25／末節22mm（赤＝PIP、橙＝DIP）</text>`;
s.innerHTML = out;
</script>
</body></html>
