<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="横カメラ">
<meta name="theme-color" content="#0d0f13">
<link rel="manifest" href="./phone.webmanifest">
<link rel="apple-touch-icon" href="./icon-phone-180.png">
<title>横カメラ</title>
<style>
  :root { --bg:#0d0f13; --fg:#eef0f3; --mut:#9aa1ab; --accent:#5aa9ff; --ok:#3ecf8e; --warn:#f5b84b; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden; font:16px/1.5 system-ui, "Hiragino Sans", sans-serif; -webkit-user-select:none; user-select:none; }
  #view { position:fixed; inset:0; width:100vw; height:100vh; object-fit:contain; display:block; }
  #top { position:fixed; left:0; right:0; top:0; padding:calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 14px) 6px calc(env(safe-area-inset-left) + 14px);
    display:flex; gap:10px; align-items:center; background:linear-gradient(rgba(0,0,0,.7), rgba(0,0,0,0)); }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--mut); flex:none; } .dot.ok { background:var(--ok); } .dot.warn { background:var(--warn); }
  #msg { font-weight:600; flex:1; } #meta { color:var(--mut); font-size:12px; font-variant-numeric:tabular-nums; }
  #start { position:fixed; inset:0; display:flex; flex-direction:column; gap:14px; align-items:center; justify-content:center; background:var(--bg); padding:16px; }
  #addr { font:700 30px/1 ui-monospace, monospace; text-align:center; width:9em; padding:10px 8px;
    border-radius:14px; border:2px solid #333944; background:#181b21; color:var(--fg); }
  #go { font:inherit; font-size:18px; font-weight:700; padding:12px 30px; border-radius:14px; border:0; background:var(--accent); color:#04203f; }
  #startErr { color:var(--warn); min-height:1.5em; margin:0; }
  .lbl { color:var(--mut); }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="top"><span class="dot" id="linkDot"></span><span id="msg">準備中</span><span id="meta"></span></div>
<div id="start">
  <span class="lbl">PCのアドレス</span>
  <input id="addr" autocomplete="off" spellcheck="false" inputmode="decimal" placeholder="172.20.10.2">
  <button id="go">開始</button>
  <p id="startErr"></p>
</div>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});</script>
<script type="module" src="./phone.js?v=4"></script>
</body>
</html>
