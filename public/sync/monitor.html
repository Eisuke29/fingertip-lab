<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>操作画面</title>
<style>
  :root { --bg:#101216; --panel:#181b21; --panel2:#20242c; --line:#2f343e; --fg:#eef0f3; --mut:#9aa1ab; --accent:#5aa9ff; --ok:#3ecf8e; --warn:#f5b84b; --ng:#ff6b6b; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:15px/1.55 system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  button, input { font:inherit; color:inherit; }
  #main { height:100%; display:grid; grid-template-columns:1fr 430px; gap:14px; padding:14px; }
  #vwrap { position:relative; min-width:0; display:flex; align-items:center; justify-content:center; background:#000; border-radius:12px; border:1px solid var(--line); overflow:hidden; }
  #pv { width:100%; height:100%; object-fit:contain; display:block; }
  #noVideo { position:absolute; color:var(--mut); font-size:16px; }
  #side { display:flex; flex-direction:column; gap:10px; overflow:auto; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  #links { display:flex; gap:16px; flex-wrap:wrap; font-size:14px; }
  .qrs { display:flex; gap:16px; margin-top:10px; flex-wrap:wrap; }
  .qrs img { background:#fff; padding:6px; border-radius:8px; width:140px; display:block; }
  .qrs .u { color:var(--mut); font-size:11px; word-break:break-all; max-width:150px; }
  #stages { display:flex; flex-wrap:wrap; gap:6px; }
  .sg { display:flex; align-items:center; gap:6px; padding:4px 10px 4px 4px; border-radius:999px; background:var(--panel2); border:1px solid var(--line); color:var(--mut); font-weight:600; font-size:13px; cursor:pointer; }
  .sg i { width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-style:normal; font-size:12px; background:#2f343e; }
  .sg.cur { color:var(--fg); border-color:var(--accent); } .sg.cur i { background:var(--accent); color:#04203f; } .sg.done i { background:var(--ok); color:#06261a; }
  h2 { font-size:19px; margin:12px 0 4px; }
  .lbl { color:var(--mut); font-size:12px; font-weight:700; margin-top:8px; }
  .txt { margin:2px 0; }
  .checks { list-style:none; padding:0; margin:4px 0; }
  .checks li { display:flex; gap:8px; align-items:baseline; padding:2px 0; }
  .checks b { width:1.1em; flex:none; } .c-ok b { color:var(--ok); } .c-ng b { color:var(--ng); } .c-na b { color:var(--mut); } .c-warn b { color:var(--warn); }
  .checks .v { color:var(--mut); margin-left:auto; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .fix { background:rgba(255,107,107,.08); border:1px solid rgba(255,107,107,.35); border-radius:10px; padding:8px 10px; margin-top:8px; }
  .fix ul { margin:4px 0 0; padding-left:18px; }
  #btns { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .btn { border:1px solid var(--line); background:var(--panel2); padding:9px 16px; border-radius:10px; cursor:pointer; font-weight:700; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#04203f; }
  .btn.next { margin-left:auto; } .btn:disabled { opacity:.35; cursor:default; }
  .busy { color:var(--warn); font-weight:700; margin-top:8px; }
  details summary { cursor:pointer; color:var(--mut); font-weight:700; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; font-size:13px; } td { padding:3px 2px; border-bottom:1px solid var(--line); } td:last-child { text-align:right; }
  .big { font-size:28px; font-weight:700; font-variant-numeric:tabular-nums; } .big small { font-size:13px; color:var(--mut); margin-right:4px; }
  .note { color:var(--mut); font-size:13px; }
</style>
</head>
<body>
<div id="main">
  <div id="vwrap"><canvas id="pv"></canvas><div id="noVideo">iPhoneのカメラ映像がここに出ます</div></div>
  <div id="side">
    <div class="card"><div id="links"></div><div class="qrs" id="qrs"></div><div class="note" id="certHelp"></div></div>
    <div class="card">
      <div id="stages"></div>
      <h2 id="title"></h2>
      <div class="lbl">何のため</div><div class="txt" id="why"></div>
      <div class="lbl">やること</div><div class="txt" id="todo"></div>
      <div class="lbl">合格の目安</div><ul class="checks" id="checks"></ul>
      <div id="busy" class="busy"></div>
      <div id="fix" class="fix" hidden></div>
      <div id="btns"></div>
    </div>
    <div class="card"><div style="display:flex;gap:22px"><div class="big"><small>θp</small><span id="p">—</span></div><div class="big"><small>θd</small><span id="d">—</span></div></div><div class="note" id="trk"></div></div>
    <details class="card"><summary>数値の詳細</summary><table id="nums"></table></details>
    <details class="card"><summary>検証・設定</summary><div id="tools"></div></details>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script type="module" src="./monitor.js?v=3"></script>
</body>
</html>
