<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="指触覚">
<meta name="theme-color" content="#15171c">
<link rel="manifest" href="./ipad.webmanifest">
<link rel="apple-touch-icon" href="./icon-ipad-180.png">
<title>ディスプレイ内指触覚</title>
<style>
  html,body { margin:0; height:100%; background:#15171c; overflow:hidden; overscroll-behavior:none; touch-action:none; -webkit-user-select:none; user-select:none; }
  canvas { position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  #cal { z-index:5; background:#000; }
  #still { z-index:2; pointer-events:none; }
  [hidden] { display:none !important; }
  #card { position:fixed; z-index:6; left:50%; top:50%; transform:translate(-50%,-50%); border:3px solid #5aa9ff; border-radius:12px; display:none; }
  /* the only thing ever asked on the iPad: one tap (full screen + motion sensor permission) */
  #tap { position:fixed; inset:0; z-index:10; background:#15171c; display:grid; place-items:center; color:#9aa1ab; font:600 22px system-ui, "Hiragino Sans", sans-serif; }
  #rotate { position:fixed; inset:0; z-index:20; background:#15171c; display:none; place-items:center; color:#eef0f3; font:700 22px system-ui, sans-serif; }
  @media (orientation: portrait) { #rotate { display:grid; } }
  #flash { position:fixed; inset:0; z-index:30; background:#000; display:none; }
</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three/three.module.js" } }
</script>
</head>
<body>
<canvas id="display"></canvas>
<canvas id="still"></canvas>
<canvas id="cal" hidden></canvas>
<div id="card"></div>
<div id="tap">タップ</div>
<div id="rotate">横向きにしてください</div>
<div id="flash"></div>
<script type="module" src="./ipad.js"></script>
</body>
</html>
