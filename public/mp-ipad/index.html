<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="なでる">
<meta name="theme-color" content="#0a0c0c">
<title>なでる（iPad）</title>
<style>html,body{margin:0;height:100%;background:#0b0c0e;overflow:hidden;overscroll-behavior:none;touch-action:none}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<!-- This outer page keeps the full screen, the camera and the permissions. Only the inner page is loaded again when there is something new. -->
<script>
window.shell = { stream: null, motion: false, started: false };
const f = document.createElement('iframe'); f.allow = 'camera; accelerometer; gyroscope; magnetometer; fullscreen; screen-wake-lock; web-share'; f.allowFullscreen = true;
const q = new URLSearchParams(location.search); q.set('t', Date.now()); f.src = 'app.html?' + q; document.body.append(f);
for (const n of ['gesturestart', 'contextmenu', 'dblclick']) addEventListener(n, (e) => e.preventDefault());
</script>
</body>
</html>
