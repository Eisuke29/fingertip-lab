<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15171c">
<title>iPadの傾きを測る</title>
<style>
  :root { --bg:#15171c; --panel:#1e2229; --line:#343a45; --fg:#eef0f3; --mut:#9aa1ab; --accent:#5aa9ff; --ok:#3ecf8e; --warn:#f5b84b; }
  * { box-sizing:border-box; } [hidden] { display:none !important; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--fg); font:17px/1.6 system-ui,"Hiragino Sans","Yu Gothic UI",sans-serif; }
  main { max-width:640px; margin:0 auto; padding:24px 16px; text-align:center; }
  h1 { font-size:20px; margin:0; } #deg { font-size:120px; font-weight:800; line-height:1.15; font-variant-numeric:tabular-nums; }
  #state { min-height:28px; font-weight:700; color:var(--mut); } #state.ok { color:var(--ok); } #state.warn { color:var(--warn); }
  .btn { font:inherit; font-weight:700; color:inherit; border:1px solid var(--line); background:var(--panel); padding:12px 22px; border-radius:10px; margin:10px 4px; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#04203f; } .btn:disabled { opacity:.35; }
  ol { text-align:left; max-width:300px; margin:8px auto; font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; } .mut { color:var(--mut); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>iPadの傾き（机から）</h1>
  <div id="deg">—</div>
  <div id="state">ケースで立てて机に置き、［測る］を押す</div>
  <button class="btn primary" id="go">測る</button>
  <button class="btn primary" id="keep" hidden disabled>この角度を残す</button>
  <ol id="list"></ol>
  <div class="mut">0°＝机に平ら、90°＝まっすぐ立てた状態。机が水平なときの値です。</div>
</main>
<script>
const $ = (s) => document.querySelector(s); let v = [], mean = null, got = false;
const clock = () => performance.now();
$('#go').onclick = async () => {
  try {
    if (typeof DeviceMotionEvent === 'undefined') throw new Error('この端末には傾きセンサーがありません');
    if (DeviceMotionEvent.requestPermission && await DeviceMotionEvent.requestPermission() !== 'granted') throw new Error('傾きセンサーが許可されていません。ページを開き直して、もう一度［測る］→［許可］');
  } catch (e) { $('#state').textContent = e.message || 'もう一度［測る］を押してください'; $('#state').className = 'warn'; return; }
  $('#go').hidden = true; $('#keep').hidden = false; $('#state').textContent = '測っています';
  addEventListener('devicemotion', read);
  setTimeout(() => { if (!got) { $('#state').textContent = '傾きセンサーの値が来ません。iPadで開いているか確かめてください'; $('#state').className = 'warn'; $('#go').hidden = false; $('#keep').hidden = true; removeEventListener('devicemotion', read); } }, 3000);
};
function read(e) {
  const g = e.accelerationIncludingGravity; if (!g || g.z == null) return; const n = Math.hypot(g.x, g.y, g.z); if (n < 5) return;
  got = true; const now = clock(); v.push({ t: now, x: g.x, y: g.y, z: g.z }); while (now - v[0].t > 1500) v.shift();
  // the mean of the gravity vector over 1.5 s, then its angle
  const m = ['x', 'y', 'z'].map((k) => v.reduce((s, q) => s + q[k], 0) / v.length), ang = (x, y, z) => Math.acos(Math.min(1, Math.abs(z) / Math.hypot(x, y, z))) * 180 / Math.PI;
  mean = ang(...m);
  const a = v.map((q) => ang(q.x, q.y, q.z)), still = v.length >= 20 && now - v[0].t > 1200 && Math.max(...a) - Math.min(...a) < 2;
  $('#deg').textContent = `${mean.toFixed(1)}°`; $('#state').textContent = still ? '止まっています（この値でOK）' : '動かさずに待つ'; $('#state').className = still ? 'ok' : 'warn'; $('#keep').disabled = !still;
}
$('#keep').onclick = () => { const li = document.createElement('li'); li.textContent = `${mean.toFixed(1)}°`; $('#list').append(li); };
</script>
</body>
</html>
